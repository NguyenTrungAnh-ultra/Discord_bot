name: VCI News Auto Sender

on:
  schedule:
    - cron: '*/60 * * * *'
  workflow_dispatch:

# --- THÊM PHẦN NÀY ---
permissions:
  contents: write
# ---------------------

jobs:
  run-news-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install libraries
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Cài thêm pandas hoặc requests nếu chưa có trong requirements.txt
          pip install requests python-dotenv discord.py

      - name: Run Main Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python Firms_news.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # QUAN TRỌNG: Chỉ định đúng file trong thư mục source
          git add source/requested_news.json

          if ! git diff --staged --quiet; then
            git commit -m "Auto update news: source/requested_news.json"
            git push
          else
            echo "No changes to commit (Không có tin mới)."
          fi
          
