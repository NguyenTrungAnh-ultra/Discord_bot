# searxng/settings.yml
use_default_settings: true
server:
  base_url: http://localhost:8080/
  secret_key: "discord-bot-deep-research-secret-key"
search:
  formats:
    - html
    - json
  # Enable some common engines
engines:
  - name: google
    engine: google
    shortcut: g
  - name: bing
    engine: bing
    shortcut: b
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
